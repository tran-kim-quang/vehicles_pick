[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "order-vehicles"
version = "0.1.0"
description = "Reusable voice booking service with VoiceStudio speech providers"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
  "websockets>=15,<17",
]

[project.optional-dependencies]
audio = ["numpy>=2.2,<3", "sounddevice>=0.5,<1", "soxr>=0.5,<1"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/order_vehicles"]
